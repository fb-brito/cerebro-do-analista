<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerenciador de Projetos: Quadro Kanban</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
    <link rel="stylesheet" href="./css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <style>
        /* ===== Estilos para o Quadro Kanban e Drag & Drop ===== */
        .gantt-timeline-scroll {
            overflow-x: auto;
            position: relative;
        }

        .kanban-column {
            min-width: 290px;
            max-width: 350px;
            flex-grow: 1;
            transition: background-color 0.2s ease;
        }

        .kanban-drag-hover {
            background-color: rgba(99, 102, 241, 0.05);
            border: 2px dashed rgba(99, 102, 241, 0.4);
        }

        .dark .kanban-drag-hover {
            background-color: rgba(99, 102, 241, 0.1);
        }

        .column-drag-hover {
            background-color: rgba(99, 102, 241, 0.08);
            border: 2px dashed rgba(99, 102, 241, 0.6) !important;
            opacity: 0.9;
        }

        .column-dragging {
            opacity: 0.35;
        }

        .kanban-card {
            cursor: grab;
            transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.15s ease;
        }

        .kanban-card:active {
            cursor: grabbing;
        }

        .kanban-card.dragging {
            opacity: 0.4;
            transform: scale(0.98);
        }

        /* ===== Cores Dinâmicas e Tags do Kanban ===== */
        .badge-status {
            font-size: 0.68rem;
            font-weight: 700;
            padding: 0.2rem 0.6rem;
            border-radius: 9999px;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }

        .dark-badge-border {
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* ===== Grade de Dias do Calendário ===== */
        .calendar-day-box {
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 0.4rem;
            background: white;
            transition: background-color 0.15s;
        }

        .dark .calendar-day-box {
            background: rgba(15, 23, 42, 0.4);
        }

        .calendar-day-box.empty {
            background: rgba(248, 250, 252, 0.6);
            color: #94a3b8;
        }

        .dark .calendar-day-box.empty {
            background: rgba(30, 41, 59, 0.25);
            color: #475569;
        }

        .calendar-day-box.today {
            background: rgba(99, 102, 241, 0.03);
        }

        .dark .calendar-day-box.today {
            background: rgba(99, 102, 241, 0.06);
        }

        .calendar-day-num {
            font-size: 0.72rem;
            font-weight: 700;
            color: #64748b;
            margin-bottom: 0.35rem;
            width: 1.25rem;
            height: 1.25rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .calendar-day-box.today .calendar-day-num {
            background: #6366f1;
            color: white;
            border-radius: 99px;
        }

        .calendar-task-tag {
            font-size: 0.68rem;
            padding: 0.15rem 0.4rem;
            border-radius: 0.25rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 0.15rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
        }

        /* ===== Botões Ativos nas Visões ===== */
        .active-view {
            background-color: rgba(99, 102, 241, 0.1) !important;
            color: #6366f1 !important;
            border: 1px solid rgba(99, 102, 241, 0.25) !important;
        }

        /* ===== Cores de Coluna (Temas) ===== */
        .col-theme-default {
            --dot-color: #94a3b8;
            --bg-color: rgba(248, 250, 252, 0.7);
            --border-color: rgba(226, 232, 240, 0.6);
        }

        .dark .col-theme-default {
            --dot-color: #64748b;
            --bg-color: rgba(15, 23, 42, 0.4);
            --border-color: rgba(30, 41, 59, 0.8);
        }

        .col-theme-gray {
            --dot-color: #9ca3af;
            --bg-color: rgba(243, 244, 246, 0.7);
            --border-color: rgba(229, 231, 235, 0.8);
        }

        .dark .col-theme-gray {
            --dot-color: #6b7280;
            --bg-color: rgba(31, 41, 55, 0.4);
            --border-color: rgba(55, 65, 81, 0.8);
        }

        .col-theme-brown {
            --dot-color: #a8a29e;
            --bg-color: rgba(245, 245, 244, 0.7);
            --border-color: rgba(231, 229, 228, 0.8);
        }

        .dark .col-theme-brown {
            --dot-color: #78716c;
            --bg-color: rgba(28, 25, 23, 0.4);
            --border-color: rgba(68, 64, 60, 0.8);
        }

        .col-theme-orange {
            --dot-color: #f97316;
            --bg-color: rgba(255, 237, 213, 0.5);
            --border-color: rgba(253, 186, 116, 0.5);
        }

        .dark .col-theme-orange {
            --dot-color: #ea580c;
            --bg-color: rgba(124, 45, 18, 0.2);
            --border-color: rgba(154, 52, 18, 0.4);
        }

        .col-theme-yellow {
            --dot-color: #eab308;
            --bg-color: rgba(254, 249, 195, 0.5);
            --border-color: rgba(253, 224, 71, 0.5);
        }

        .dark .col-theme-yellow {
            --dot-color: #ca8a04;
            --bg-color: rgba(113, 63, 18, 0.2);
            --border-color: rgba(133, 77, 14, 0.4);
        }

        .col-theme-green {
            --dot-color: #22c55e;
            --bg-color: rgba(220, 252, 231, 0.5);
            --border-color: rgba(134, 239, 172, 0.5);
        }

        .dark .col-theme-green {
            --dot-color: #16a34a;
            --bg-color: rgba(20, 83, 45, 0.2);
            --border-color: rgba(22, 101, 52, 0.4);
        }

        .col-theme-blue {
            --dot-color: #3b82f6;
            --bg-color: rgba(219, 234, 254, 0.5);
            --border-color: rgba(147, 197, 253, 0.5);
        }

        .dark .col-theme-blue {
            --dot-color: #2563eb;
            --bg-color: rgba(30, 58, 138, 0.2);
            --border-color: rgba(30, 64, 175, 0.4);
        }

        .col-theme-purple {
            --dot-color: #a855f7;
            --bg-color: rgba(243, 232, 255, 0.5);
            --border-color: rgba(216, 180, 254, 0.5);
        }

        .dark .col-theme-purple {
            --dot-color: #9333ea;
            --bg-color: rgba(88, 28, 135, 0.2);
            --border-color: rgba(107, 33, 168, 0.4);
        }

        .col-theme-pink {
            --dot-color: #ec4899;
            --bg-color: rgba(252, 231, 243, 0.5);
            --border-color: rgba(249, 168, 212, 0.5);
        }

        .dark .col-theme-pink {
            --dot-color: #db2777;
            --bg-color: rgba(131, 24, 67, 0.2);
            --border-color: rgba(157, 23, 77, 0.4);
        }

        .col-theme-red {
            --dot-color: #ef4444;
            --bg-color: rgba(254, 226, 226, 0.5);
            --border-color: rgba(252, 165, 165, 0.5);
        }

        .dark .col-theme-red {
            --dot-color: #dc2626;
            --bg-color: rgba(127, 29, 29, 0.2);
            --border-color: rgba(153, 27, 27, 0.4);
        }

        .kanban-column-themed {
            background-color: var(--bg-color) !important;
            border-color: var(--border-color) !important;
        }

        .kanban-column-themed .col-dot {
            background-color: var(--dot-color) !important;
        }

        /* ===== Cores das Etiquetas (Tags) ===== */
        .tag-theme-default { background-color: #f1f5f9 !important; color: #334155 !important; }
        .tag-theme-gray { background-color: #f3f4f6 !important; color: #374151 !important; }
        .tag-theme-brown { background-color: #f5f5f4 !important; color: #44403c !important; }
        .tag-theme-orange { background-color: #ffedd5 !important; color: #9a3412 !important; }
        .tag-theme-yellow { background-color: #fef9c3 !important; color: #854d0e !important; }
        .tag-theme-green { background-color: #dcfce7 !important; color: #166534 !important; }
        .tag-theme-blue { background-color: #dbeafe !important; color: #1e40af !important; }
        .tag-theme-purple { background-color: #f3e8ff !important; color: #6b21a8 !important; }
        .tag-theme-pink { background-color: #fce7f3 !important; color: #9d174d !important; }
        .tag-theme-red { background-color: #fee2e2 !important; color: #991b1b !important; }

        .dark .tag-theme-default { background-color: rgba(71, 85, 105, 0.4) !important; color: #cbd5e1 !important; }
        .dark .tag-theme-gray { background-color: rgba(75, 85, 99, 0.4) !important; color: #d1d5db !important; }
        .dark .tag-theme-brown { background-color: rgba(87, 83, 78, 0.4) !important; color: #d6d3d1 !important; }
        .dark .tag-theme-orange { background-color: rgba(154, 52, 18, 0.3) !important; color: #fdba74 !important; }
        .dark .tag-theme-yellow { background-color: rgba(133, 77, 14, 0.3) !important; color: #fde047 !important; }
        .dark .tag-theme-green { background-color: rgba(22, 101, 52, 0.3) !important; color: #86efac !important; }
        .dark .tag-theme-blue { background-color: rgba(30, 58, 138, 0.4) !important; color: #93c5fd !important; }
        .dark .tag-theme-purple { background-color: rgba(88, 28, 135, 0.4) !important; color: #d8b4fe !important; }
        .dark .tag-theme-pink { background-color: rgba(131, 24, 67, 0.4) !important; color: #f9a8d4 !important; }
        .dark .tag-theme-red { background-color: rgba(127, 29, 29, 0.4) !important; color: #fca5a5 !important; }

        .kanban-tag-themed {
            font-size: 0.72rem;
            font-weight: 600;
            padding: 0.15rem 0.5rem;
            border-radius: 0.25rem;
            display: inline-flex;
            align-items: center;
            border: none !important;
        }

        /* ===== Scrollbar Horizontal sempre visível ===== */

        .dark .col-theme-orange {
            --dot-color: #ea580c;
            --bg-color: rgba(124, 45, 18, 0.2);
            --border-color: rgba(154, 52, 18, 0.4);
        }

        .col-theme-yellow {
            --dot-color: #eab308;
            --bg-color: rgba(254, 249, 195, 0.5);
            --border-color: rgba(253, 224, 71, 0.5);
        }

        .dark .col-theme-yellow {
            --dot-color: #ca8a04;
            --bg-color: rgba(113, 63, 18, 0.2);
            --border-color: rgba(133, 77, 14, 0.4);
        }

        .col-theme-green {
            --dot-color: #22c55e;
            --bg-color: rgba(220, 252, 231, 0.5);
            --border-color: rgba(134, 239, 172, 0.5);
        }

        .dark .col-theme-green {
            --dot-color: #16a34a;
            --bg-color: rgba(20, 83, 45, 0.2);
            --border-color: rgba(22, 101, 52, 0.4);
        }

        .col-theme-blue {
            --dot-color: #3b82f6;
            --bg-color: rgba(219, 234, 254, 0.5);
            --border-color: rgba(147, 197, 253, 0.5);
        }

        .dark .col-theme-blue {
            --dot-color: #2563eb;
            --bg-color: rgba(30, 58, 138, 0.2);
            --border-color: rgba(30, 64, 175, 0.4);
        }

        .col-theme-purple {
            --dot-color: #a855f7;
            --bg-color: rgba(243, 232, 255, 0.5);
            --border-color: rgba(216, 180, 254, 0.5);
        }

        .dark .col-theme-purple {
            --dot-color: #9333ea;
            --bg-color: rgba(88, 28, 135, 0.2);
            --border-color: rgba(107, 33, 168, 0.4);
        }

        .col-theme-pink {
            --dot-color: #ec4899;
            --bg-color: rgba(252, 231, 243, 0.5);
            --border-color: rgba(249, 168, 212, 0.5);
        }

        .dark .col-theme-pink {
            --dot-color: #db2777;
            --bg-color: rgba(131, 24, 67, 0.2);
            --border-color: rgba(157, 23, 77, 0.4);
        }

        .col-theme-red {
            --dot-color: #ef4444;
            --bg-color: rgba(254, 226, 226, 0.5);
            --border-color: rgba(252, 165, 165, 0.5);
        }

        .dark .col-theme-red {
            --dot-color: #dc2626;
            --bg-color: rgba(127, 29, 29, 0.2);
            --border-color: rgba(153, 27, 27, 0.4);
        }

        .kanban-column-themed {
            background-color: var(--bg-color) !important;
            border-color: var(--border-color) !important;
        }

        .kanban-column-themed .col-dot {
            background-color: var(--dot-color) !important;
        }



        /* ===== Scrollbar Horizontal sempre visível ===== */
        #kanban-board-container::-webkit-scrollbar {
            height: 10px;
        }

        #kanban-board-container::-webkit-scrollbar-track {
            background: #f1f5f9;
            border-radius: 8px;
        }

        .dark #kanban-board-container::-webkit-scrollbar-track {
            background: #1e293b;
        }

        #kanban-board-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 8px;
        }

        .dark #kanban-board-container::-webkit-scrollbar-thumb {
            background: #475569;
        }

        #kanban-board-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>

<body class="antialiased bg-light dark:bg-dark text-gray-800 dark:text-gray-200">
    <div id="header-placeholder"></div>

    <main class="container mx-auto p-4 md:p-8 max-w-7xl">

        <!-- Seção de Título e Layouts -->
        <section class="mb-8 pt-4">
            <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                <div>
                    <h1 class="text-3xl md:text-4xl font-bold text-gradient mb-2" id="main-title">Quadro de Tarefas</h1>
                    <p class="text-sm text-gray-600 dark:text-gray-400" id="main-desc">Gerenciamento ágil de tarefas.
                    </p>
                </div>
                <!-- Seletor de Layouts (Projetos) -->
                <div class="flex flex-wrap gap-2 bg-gray-100 dark:bg-slate-800 p-1.5 rounded-xl border border-gray-200 dark:border-slate-700"
                    id="kanban-layouts">
                    <button
                        class="layout-btn px-4 py-2 text-sm font-bold rounded-lg transition-all bg-white dark:bg-slate-900 text-primary shadow-sm active-layout"
                        data-layout="branco">
                        <i class="fas fa-chalkboard mr-2"></i> Quadro Branco
                    </button>
                    <button
                        class="layout-btn px-4 py-2 text-sm font-bold rounded-lg transition-all text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-slate-700"
                        data-layout="gerenciamento">
                        <i class="fas fa-tasks mr-2"></i> Tarefas
                    </button>
                    <button
                        class="layout-btn px-4 py-2 text-sm font-bold rounded-lg transition-all text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-slate-700"
                        data-layout="conteudo">
                        <i class="fas fa-bullhorn mr-2"></i> Conteúdo
                    </button>
                    <button
                        class="layout-btn px-4 py-2 text-sm font-bold rounded-lg transition-all text-gray-600 dark:text-gray-400 hover:bg-gray-200 dark:hover:bg-slate-700"
                        data-layout="fluxo">
                        <i class="fas fa-project-diagram mr-2"></i> Fluxo
                    </button>
                </div>
            </div>
        </section>

        <!-- Barra de Visões superior (Sub-menu Notion) -->
        <section class="mb-6">
            <div class="flex flex-wrap gap-2 border-b border-gray-200 dark:border-slate-700 pb-3" id="kanban-views">
                <!-- Injetado dinamicamente via JS -->
            </div>
        </section>

        <!-- Painel de Ações do Kanban -->
        <section class="mb-8">
            <div class="glass-card rounded-2xl p-6 flex flex-wrap gap-4 items-center justify-between shadow-sm">
                <!-- Ações de Novo Item e Limpeza -->
                <div class="flex flex-wrap gap-3">
                    <button id="btn-new-item"
                        class="px-5 py-2.5 bg-primary hover:bg-primary/95 text-white font-semibold rounded-lg flex items-center gap-2 shadow transition-all duration-300 transform hover:-translate-y-0.5">
                        <i class="fas fa-columns"></i> Nova Coluna
                    </button>
                    <button id="btn-clear-kanban"
                        class="px-5 py-2.5 bg-gray-200 dark:bg-slate-700 hover:bg-red-500 dark:hover:bg-red-600 hover:text-white text-gray-700 dark:text-gray-200 font-semibold rounded-lg flex items-center gap-2 transition-all duration-300">
                        <i class="fas fa-trash-alt"></i> Limpar Tudo
                    </button>
                </div>

                <!-- Importar / Exportar -->
                <div class="flex items-center gap-2">
                    <button id="btn-export-kanban"
                        class="p-2.5 bg-gray-100 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg text-gray-600 dark:text-gray-300 hover:text-primary hover:border-primary transition-colors flex items-center justify-center"
                        title="Exportar Kanban (JSON)">
                        <img src="img/ico/export.png" alt="Exportar Kanban" class="w-5 h-5 object-contain">
                    </button>
                    <input type="file" id="file-import-kanban" accept=".json" class="hidden">
                    <button id="btn-import-kanban-trigger"
                        class="p-2.5 bg-gray-100 dark:bg-slate-800 border border-gray-300 dark:border-slate-600 rounded-lg text-gray-600 dark:text-gray-300 hover:text-primary hover:border-primary transition-colors flex items-center justify-center"
                        title="Importar Kanban (JSON)">
                        <img src="img/ico/import.png" alt="Importar Kanban" class="w-5 h-5 object-contain">
                    </button>
                </div>
            </div>
        </section>

        <!-- Conteúdo Principal do Kanban -->
        <section class="mb-16">
            <!-- Modo Kanban (Colunas Dinâmicas) -->
            <div id="kanban-board-container" class="flex gap-6 overflow-x-auto pb-6 w-full items-start min-h-[500px]">
                <!-- Injetado dinamicamente via JS -->
            </div>

            <!-- Modo Calendário (Oculto por padrão) -->
            <div id="kanban-calendar-container"
                class="hidden bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-800 rounded-2xl p-6 shadow-sm">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold flex items-center gap-2 text-primary" id="calendar-month-year">
                        Junho de 2026
                    </h3>
                    <div class="flex gap-2 items-center">
                        <button id="btn-calendar-prev"
                            class="p-2 border border-gray-200 dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-800 rounded-lg text-gray-600 dark:text-gray-300 transition-colors">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <button id="btn-calendar-today"
                            class="px-3 py-1.5 border border-gray-200 dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-800 text-sm font-semibold rounded-lg text-gray-600 dark:text-gray-300 transition-colors">
                            Hoje
                        </button>
                        <button id="btn-calendar-next"
                            class="p-2 border border-gray-200 dark:border-slate-700 hover:bg-gray-50 dark:hover:bg-slate-800 rounded-lg text-gray-600 dark:text-gray-300 transition-colors">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>

                <!-- Grade de Dias da Semana -->
                <div
                    class="grid grid-cols-7 gap-px bg-gray-200 dark:bg-slate-800 rounded-t-xl overflow-hidden border border-gray-200 dark:border-slate-800 text-center text-xs font-bold text-gray-500 mb-1">
                    <div class="py-2 bg-gray-50 dark:bg-slate-900">Dom</div>
                    <div class="py-2 bg-gray-50 dark:bg-slate-900">Seg</div>
                    <div class="py-2 bg-gray-50 dark:bg-slate-900">Ter</div>
                    <div class="py-2 bg-gray-50 dark:bg-slate-900">Qua</div>
                    <div class="py-2 bg-gray-50 dark:bg-slate-900">Qui</div>
                    <div class="py-2 bg-gray-50 dark:bg-slate-900">Sex</div>
                    <div class="py-2 bg-gray-50 dark:bg-slate-900">Sáb</div>
                </div>

                <!-- Grade dos Dias do Mês -->
                <div id="calendar-days-grid"
                    class="grid grid-cols-7 gap-px bg-gray-200 dark:bg-slate-800 rounded-b-xl overflow-hidden border border-gray-200 dark:border-slate-800 text-left min-h-[450px]">
                    <!-- Injetado dinamicamente via JS -->
                </div>
            </div>
        </section>

    </main>

    <div id="footer-placeholder"></div>

    <!-- ===== Modal de Criação / Edição de Tarefas ===== -->
    <div id="kanban-item-modal"
        class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/45 backdrop-blur-[2px] hidden">
        <div
            class="bg-white dark:bg-slate-900 w-full max-w-lg rounded-2xl p-6 mx-4 shadow-2xl border border-gray-200 dark:border-slate-800 max-h-[90vh] overflow-y-auto delete-modal-box">
            <div class="flex justify-between items-center mb-6 border-b border-gray-100 dark:border-slate-800/80 pb-3">
                <h3 id="modal-title" class="text-xl font-bold">Novo post-it</h3>
                <button id="btn-close-modal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 text-xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <form id="kanban-form" class="space-y-4">
                <input type="hidden" id="modal-item-id">

                <!-- Título -->
                <div>
                    <label for="item-title"
                        class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Título
                        do post-it</label>
                    <input type="text" id="item-title" required
                        class="w-full px-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-transparent focus:outline-none focus:border-primary text-sm"
                        placeholder="Ex: Projetar gráficos de mídia social">
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4" id="status-container-global">
                    <div id="wrap-status">
                        <label id="lbl-item-status" for="item-status"
                            class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Status</label>
                        <div class="flex items-center gap-2">
                            <select id="item-status"
                                class="flex-1 px-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 focus:outline-none focus:border-primary text-sm">
                            </select>
                            <div class="custom-color-picker-container" data-input-id="status-color-input"></div>
                        </div>
                    </div>
                </div>

                <!-- Campos Dinâmicos (Quadro Branco) -->
                <div id="dynamic-custom-fields-container" class="space-y-4 hidden">
                    <!-- Custom fields serão renderizados aqui -->
                </div>
                <button type="button" id="btn-add-custom-field" class="hidden text-sm font-bold text-primary hover:text-indigo-700 dark:hover:text-indigo-400 flex items-center transition-colors">
                    <i class="fas fa-plus mr-1"></i> Novo Campo
                </button>

                <!-- Campos Fixos (Outros Layouts) -->
                <div id="fixed-fields-wrapper" class="space-y-4">
                    <!-- Prioridade -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div id="wrap-priority">
                            <label id="lbl-item-priority" for="item-priority"
                                class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Prioridade</label>
                            <select id="item-priority"
                                class="w-full px-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 focus:outline-none focus:border-primary text-sm">
                            </select>
                        </div>
                    </div>

                    <!-- Campos Específicos Ocultos (Plataforma, Orçamento, Saúde) -->
                    <div id="dynamic-fields-row" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                        <div id="wrap-platform" class="hidden">
                            <label for="item-platform"
                                class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Plataforma</label>
                            <div class="flex items-center gap-2">
                                <select id="item-platform"
                                    class="flex-1 px-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 focus:outline-none focus:border-primary text-sm">
                                </select>
                                <div class="custom-color-picker-container" data-input-id="platform-color-input"></div>
                            </div>
                        </div>
                        <div id="wrap-budget" class="hidden">
                            <label for="item-budget"
                                class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Orçamento</label>
                            <input type="text" id="item-budget"
                                class="w-full px-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-transparent focus:outline-none focus:border-primary text-sm"
                                placeholder="R$ 0,00">
                        </div>
                        <div id="wrap-health" class="hidden">
                            <label for="item-health"
                                class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Saúde
                                do Projeto</label>
                            <select id="item-health"
                                class="w-full px-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 focus:outline-none focus:border-primary text-sm">
                            </select>
                        </div>
                    </div>

                    <!-- Categorias e Responsável -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div id="wrap-category">
                        <label id="lbl-item-category" for="item-category"
                            class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Categoria</label>
                        <div class="flex items-center gap-2">
                            <select id="item-category"
                                class="flex-1 px-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-white dark:bg-slate-800 focus:outline-none focus:border-primary text-sm">
                            </select>
                            <div class="custom-color-picker-container" data-input-id="category-color-input"></div>
                        </div>
                    </div>
                    <div id="wrap-assignee">
                        <label for="item-assignee"
                            class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Responsável</label>
                        <input type="text" id="item-assignee"
                            class="w-full px-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-transparent focus:outline-none focus:border-primary text-sm"
                            placeholder="Ex: Analista">
                    </div>
                </div>

                </div> <!-- Fim de fixed-fields-wrapper -->

                <!-- Período de Datas -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
                    <div>
                        <label for="item-start-date"
                            class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Data De</label>
                        <input type="date" id="item-start-date"
                            class="w-full px-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-transparent focus:outline-none focus:border-primary text-sm">
                    </div>
                    <div>
                        <label for="item-end-date"
                            class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Data Até</label>
                        <input type="date" id="item-end-date"
                            class="w-full px-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-transparent focus:outline-none focus:border-primary text-sm">
                    </div>
                </div>

                <!-- Notas/Detalhes -->
                <div class="mt-4">
                    <label for="item-notes"
                        class="block text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider mb-2">Notas
                        / Descrição</label>
                    <textarea id="item-notes" rows="3"
                        class="w-full px-3 py-2 border border-gray-200 dark:border-slate-700 rounded-lg bg-transparent focus:outline-none focus:border-primary text-sm"
                        placeholder="Adicione observações, links ou detalhes adicionais..."></textarea>
                </div>

                <!-- Botões -->
                <div class="flex justify-between items-center pt-4 border-t border-gray-100 dark:border-slate-800">
                    <div>
                        <button type="button" id="btn-delete-modal-item"
                            class="px-4 py-2.5 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg transition-colors text-sm hidden">
                            <i class="fas fa-trash-alt mr-1"></i> Excluir post-it
                        </button>
                    </div>
                    <div class="flex gap-3">
                        <button type="button" id="btn-cancel-modal"
                            class="px-4 py-2.5 border border-gray-300 dark:border-slate-600 text-gray-600 dark:text-gray-300 font-semibold rounded-lg hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors text-sm">
                            Cancelar
                        </button>
                        <button type="submit"
                            class="px-5 py-2.5 bg-primary hover:bg-primary/95 text-white font-semibold rounded-lg transition-colors text-sm">
                            Salvar post-it
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- ===== Popup de Confirmação de Exclusão Genérico ===== -->
    <div id="kanban-delete-modal"
        class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/45 backdrop-blur-[2px] hidden">
        <div
            class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-6 mx-4 shadow-2xl border border-gray-200 dark:border-slate-800 delete-modal-box">
            <!-- Ícone -->
            <div
                class="flex items-center justify-center w-12 h-12 rounded-full bg-red-100 dark:bg-red-900/30 mx-auto mb-4">
                <i class="fas fa-trash-alt text-red-500 text-xl"></i>
            </div>

            <!-- Texto explicativo -->
            <h3 id="delete-modal-title" class="text-center text-lg font-bold text-gray-800 dark:text-gray-100 mb-1">
                Confirmar Exclusão</h3>
            <p id="delete-modal-desc" class="text-center text-sm text-gray-500 dark:text-gray-400 mb-2">Você está
                prestes a excluir este item:</p>
            <p id="delete-item-name"
                class="text-center text-sm font-semibold text-gray-800 dark:text-gray-200 bg-gray-100 dark:bg-slate-800 rounded-lg px-3 py-2 mb-5 italic">
            </p>
            <p id="delete-modal-warning" class="text-center text-xs text-gray-500 dark:text-gray-400 mb-5">Esta ação não
                pode ser desfeita.</p>

            <!-- Botões de Ação -->
            <div class="flex gap-3">
                <button id="btn-cancel-kanban-delete"
                    class="flex-1 px-4 py-2.5 border border-gray-300 dark:border-slate-600 text-gray-600 dark:text-gray-300 font-semibold rounded-lg hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors text-sm">
                    Cancelar
                </button>
                <button id="btn-confirm-kanban-delete"
                    class="flex-1 px-4 py-2.5 bg-red-500 hover:bg-red-600 text-white font-semibold rounded-lg transition-colors flex items-center justify-center gap-2 text-sm">
                    <i class="fas fa-trash"></i> <span id="delete-btn-text">Excluir</span>
                </button>
            </div>
        </div>
    </div>

    <!-- ===== Modal de Criação / Edição de Colunas (Cartões de Grupo) ===== -->
    <div id="kanban-column-modal"
        class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/45 backdrop-blur-[2px] hidden">
        <div
            class="bg-white dark:bg-slate-900 w-full max-w-sm rounded-2xl p-6 mx-4 shadow-2xl border border-gray-200 dark:border-slate-800 delete-modal-box">
            <div class="flex justify-between items-center mb-4 border-b border-gray-100 dark:border-slate-800 pb-2">
                <h3 id="column-modal-title" class="text-lg font-bold">Nova Coluna</h3>
                <button id="btn-close-column-modal" class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-200">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <form id="kanban-column-form" class="space-y-4">
                <input type="hidden" id="column-modal-old-name">
                <div class="flex items-center gap-3">
                    <label for="column-name"
                        class="w-16 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider text-right">Coluna</label>
                    <input type="text" id="column-name" required
                        class="flex-1 px-3 py-1.5 border border-gray-200 dark:border-slate-700 rounded-lg bg-transparent focus:outline-none focus:border-primary text-sm"
                        placeholder="Ex: A Fazer, Concluído...">
                </div>
                <div class="flex items-center gap-4">
                    <div class="flex items-center gap-2 flex-1">
                        <label for="tag-color-input"
                            class="w-16 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider text-right">Etiqueta</label>
                        <div class="custom-color-picker-container" data-input-id="tag-color-input"></div>
                    </div>
                    <div class="flex items-center gap-2 flex-1">
                        <label for="column-color-input"
                            class="w-12 text-xs font-bold text-gray-500 dark:text-gray-400 uppercase tracking-wider text-right">Fundo</label>
                        <div class="custom-color-picker-container" data-input-id="column-color-input"></div>
                    </div>
                </div>
                <div class="flex gap-3 justify-end pt-2">
                    <button type="button" id="btn-cancel-column-modal"
                        class="px-4 py-2 border border-gray-300 dark:border-slate-600 text-gray-600 dark:text-gray-300 font-semibold rounded-lg hover:bg-gray-50 dark:hover:bg-slate-800 transition-colors text-sm">
                        Cancelar
                    </button>
                    <button type="submit"
                        class="px-4 py-2 bg-primary hover:bg-primary/95 text-white font-semibold rounded-lg transition-colors text-sm">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts da aplicação -->
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script type="module" src="./js/main.js"></script>
    <script src="./js/components.js"></script>
    <!-- Script principal do Kanban -->
    <script src="./js/kanban.js?v=2.0"></script>
</body>

</html>
