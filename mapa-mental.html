<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Mapa Mental - Cérebro do Analista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
</head>

<body class="antialiased flex flex-col h-screen">
    <div id="header-placeholder"></div>

    <main class="container mx-auto p-4 flex-grow flex flex-col">
        <section class="text-center mb-4">
            <h1 class="text-3xl md:text-4xl font-black dark-accent-color">Gerador de Mapa Mental a partir de Markdown
            </h1>
            <p class="text-md text-gray-600 max-w-2xl mx-auto">Faça o upload de um arquivo `.md` para visualizar sua
                estrutura como um mapa mental interativo.</p>
        </section>

        <div id="mindmap-toolbar" class="flex items-center justify-center gap-4 mb-4 p-2 rounded-md">
            <label for="markdown-upload"
                class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors cursor-pointer">
                <span>Carregar Arquivo Markdown (.md)</span>
                <input type="file" id="markdown-upload" class="hidden" accept=".md">
            </label>
            <button id="export-pdf-btn"
                class="px-4 py-2 bg-red-700 text-white font-semibold rounded-lg hover:bg-red-800 transition-colors hidden">Exportar
                como PDF</button>
        </div>

        <div class="flex-grow border rounded-lg bg-gray-50 flex items-center justify-center">
            <svg id="mindmap-container" class="w-full h-full"></svg>
            <p id="initial-message" class="text-gray-400">Seu mapa mental aparecerá aqui.</p>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>

    <script type="module" src="/js/main.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/mapa-mental.js"></script>
</body>

</html>
