<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Markdown com Validação GFM - Cérebro do Analista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/material-darker.min.css">

    <style>
        body, html { height: 100%; overflow: hidden; }
        body { display: flex; flex-direction: column; }
        main { flex-grow: 1; display: flex; flex-direction: column; min-height: 0; }
        .editor-panels-container { flex-grow: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; min-height: 0; }
        .editor-panel { display: flex; flex-direction: column; overflow: hidden; }
        .editor-panel-header { height: 65px; }
        
        /* Container para o editor CodeMirror preencher o espaço */
        .codemirror-container {
            flex-grow: 1;
            overflow: hidden;
            position: relative; /* Necessário para o CodeMirror se dimensionar */
        }
        /* Força o editor a ocupar toda a altura e usar nossa fonte mono */
        .CodeMirror {
            height: 100% !important;
            font-size: 1em !important;
            line-height: 1.6 !important;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace !important;
        }

        .gfm-badge { transition: all 0.3s ease-in-out; padding: 0.25rem 0.75rem; border-radius: 9999px; font-weight: 600; font-size: 0.875rem; display: inline-flex; align-items: center; gap: 0.5rem; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .spinner { width: 1rem; height: 1rem; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
    </style>
</head>

<body class="antialiased bg-gray-50">
    <div id="header-placeholder"></div>
    <main class="container mx-auto p-4">
        
        <section class="mb-4 p-4 bg-white border rounded-lg shadow-sm flex-shrink-0">
            <div class="flex flex-wrap items-center justify-between gap-4">
                <div class="flex-grow">
                    <label for="document-title" class="text-sm font-semibold text-gray-600 block mb-1">Nome do Documento</label>
                    <input type="text" id="document-title" placeholder="Digite o nome do arquivo..." class="w-full max-w-sm p-2 border rounded-md">
                </div>
                <div class="flex items-center gap-2 flex-wrap">
                    <button id="export-md-btn" class="px-4 py-2 bg-gray-600 text-white font-semibold rounded-lg hover:bg-gray-700 transition-colors">Exportar como .md</button>
                    <button id="export-pdf-btn" class="px-4 py-2 bg-red-700 text-white font-semibold rounded-lg hover:bg-red-800 transition-colors">Exportar como PDF</button>
                </div>
            </div>
        </section>

        <section class="editor-panels-container">
            <div class="editor-panel bg-white border rounded-lg shadow-sm">
                <div class="editor-panel-header flex items-center justify-between p-3 border-b bg-gray-50 flex-shrink-0">
                    <h2 class="text-lg font-bold text-gray-800">Digite seu Markdown aqui:</h2>
                    <div id="gfm-badge" class="gfm-badge" title="">
                        <span id="gfm-badge-text">GFM</span>
                        <div id="gfm-badge-spinner" class="spinner hidden"></div>
                    </div>
                </div>
                <div id="codemirror-editor-container" class="codemirror-container"></div>
            </div>
            <div class="editor-panel bg-white border rounded-lg shadow-sm">
                <div class="editor-panel-header flex items-center justify-between p-3 border-b bg-gray-50 flex-shrink-0">
                    <h2 class="text-lg font-bold text-gray-800">Visualização:</h2>
                    <button id="generate-map-btn" class="px-4 py-2 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700 transition-colors">Gerar Mapa Mental</button>
                </div>
                <div id="html-preview" class="p-4 md:py-6 prose"></div>
            </div>
        </section>
    </main>

    <footer id="status-footer" class="text-center p-2 text-sm text-gray-500 sticky bottom-0 bg-gray-50 w-full flex-shrink-0">
        <span id="status-message"></span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-lib@0.15.4"></script>
    <script src="https://cdn.jsdelivr.net/npm/markmap-view@0.15.4"></script>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/markdown/markdown.min.js"></script>
    
    <script type="module" src="/js/main.js"></script>
    <script src="/js/components.js"></script>
    <script src="/js/editor.js"></script>
</body>
</html>
