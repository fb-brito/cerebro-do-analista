<!DOCTYPE html>
<html lang="pt-BR" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editor Markdown - Cérebro do Analista</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Saira:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="antialiased flex flex-col h-full">
    <div id="header-placeholder"></div>
    <main class="container mx-auto p-4 flex-grow flex flex-col">

        <div id="editor-toolbar" class="flex items-end justify-between gap-4 mb-2">
            <div class="flex-grow">
                <label for="filename-input" class="text-xs font-semibold text-gray-600">Nome do Documento</label>
                <input type="text" id="filename-input" placeholder="Digite aqui o nome do arquivo" class="w-full p-1 border rounded-md text-sm">
            </div>
            <div class="flex items-center gap-2">
                <button id="export-md-btn" class="px-3 py-1 bg-gray-600 text-white text-xs font-semibold rounded hover:bg-gray-700 transition-colors">Exportar como Markdown (.md)</button>
                <button id="export-pdf-btn" class="px-3 py-1 bg-red-700 text-white text-xs font-semibold rounded hover:bg-red-800 transition-colors">Exportar como PDF</button>
            </div>
        </div>

        <div class="flex-grow grid grid-cols-1 md:grid-cols-2 gap-4 h-full">
            <div class="flex flex-col h-full">
                <label for="markdown-input" class="font-semibold mb-2 text-gray-700">Digite seu Markdown aqui:</label>
                <textarea id="markdown-input" class="w-full h-full p-4 border rounded-md resize-none font-mono text-sm" spellcheck="false"># Olá, Mundo!

Este é o seu editor de Markdown em tempo real.

## Funcionalidades

- Digite na **esquerda**.
- Veja o resultado na **direita**.

**Exemplo de código:**
```javascript
function greet(name) {
  console.log(`Olá, ${name}!`);
}
Uma citação para inspirar.

Continue a explorar e crie documentos incríveis!</textarea>
</div>
<div class="flex flex-col h-full">
<label class="font-semibold mb-2 text-gray-700">Visualização:</label>
<div id="html-preview" class="w-full h-full p-4 border rounded-md bg-white overflow-y-auto prose"></div>
</div>
</div>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js" integrity="sha512-GsLlZN/3F2ErC5ifS5QtgpiJtWd43JWSuIgh7mbzZ8zBps+dvLusV+eNQATqgA/HdeKFVgA5v3S/cIrLF7QnIg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>

<script type="module" src="/js/main.js"></script>
<script src="/js/components.js"></script>
<script src="/js/editor.js"></script>
</body>
</html>
